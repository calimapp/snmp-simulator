{{- range $i, $device := $.Values.devices }}
{{ print "---" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Chart.Name }}-{{ $device.name }}
  namaspace: {{ include "namespace" $ }}
  labels:
    {{- include "common.labels" $ | nindent 4 }}
    app.kubernetes.io/instance: {{ $.Chart.Name }}-{{ $device.name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels" $ | nindent 6 }}
      app.kubernetes.io/instance: {{ $.Chart.Name }}-{{ $device.name }}
  template:
    metadata:
      labels:
        {{- include "common.labels" $ | nindent 8 }}
        app.kubernetes.io/instance: {{ $.Chart.Name }}-{{ $device.name }}
    spec:
      {{- with $.Values.imagePullSecrets -}}
      imagePullSecrets: {{ . }}
      {{- end }}
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      containers:
        - name: {{ $.Chart.Name }}-{{ $device.name }}
          {{- if $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: CONFIG_FILEPATH
              value: "/app/config/config.yaml"
          ports:
            - name: snmpget
              containerPort: {{ $device.polling.port }}
              protocol: UDP
          {{- with $.Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.livenessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.podResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: {{ $.Chart.Name }}-{{ $device.name }}-config
{{- end }}